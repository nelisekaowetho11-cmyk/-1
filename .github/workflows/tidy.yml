
name: PRIME NET VPN - Check and Update Xray Core

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PRIME NET VPN
        uses: actions/checkout@v5
        with:
          fetch-depth: '0'

      - name: Fetch latest Xray release tag
        id: fetch-release
        run: |
          EXTERNAL_REPO="XTLS/Xray-core"
          LATEST_TAG=$(curl -s https://api.github.com/repos/$EXTERNAL_REPO/tags | jq '.[0]')
          LATEST_TAG_NAME=$(echo "$LATEST_TAG" | jq -r .name)
          LATEST_TAG_SHA=$(echo "$LATEST_TAG" | jq -r .commit.sha)
          echo "Latest Xray tag: $LATEST_TAG_NAME"
          echo "LATEST_TAG_NAME=$LATEST_TAG_NAME" >> $GITHUB_ENV
          echo "LATEST_TAG_SHA=$LATEST_TAG_SHA" >> $GITHUB_ENV

      - name: Fetch current PRIME NET VPN release tag
        id: fetch-current-tag
        run: |
          CURRENT_TAG_NAME=$(git describe --tags --abbrev=0)
          echo "Current tag: $CURRENT_TAG_NAME"
          echo "CURRENT_TAG_NAME=$CURRENT_TAG_NAME" >> $GITHUB_ENV

      - name: Compare release tags
        id: compare-tags
        run: |
          if [ "$LATEST_TAG_NAME" != "$CURRENT_TAG_NAME" ]; then
            if [ "$(printf '%s\n' "$LATEST_TAG_NAME" "$CURRENT_TAG_NAME" | sort -V | tail -n1)" == "$CURRENT_TAG_NAME" ]; then
              echo "No newer Xray release found."
              echo "needs_update=false" >> $GITHUB_ENV
            else
              echo "New Xray release found. Updating PRIME NET VPN..."
              echo "needs_update=true" >> $GITHUB_ENV
            fi
          else
            echo "Xray is already up to date."
            echo "needs_update=false" >> $GITHUB_ENV
          fi

      - name: Setup Golang
        if: env.needs_update == 'true'
        uses: actions/setup-go@v5.4.0
        with:
          go-version: 'stable'

      - name: Update Xray Core
        if: env.needs_update == 'true'
        run: |
          EXTERNAL_REPO="XTLS/Xray-core"
          GO_VERSION=$(curl -s https://raw.githubusercontent.com/$EXTERNAL_REPO/${{ env.LATEST_TAG_NAME }}/go.mod | awk '/^go / {print $2; exit}')

          if [ -n "$GO_VERSION" ]; then
            go mod edit -go=$GO_VERSION
          else
            echo "Could not detect upstream Go version."
            exit 1
          fi

          go get github.com/xtls/xray-core@${{ env.LATEST_TAG_SHA }}
          go get golang.org/x/mobile@latest
          go mod tidy -v
          git diff

      - name: Commit PRIME NET VPN updates
        id: auto-commit-action
        if: env.needs_update == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5.1.0
        with:
          commit_message: "PRIME NET VPN: Update Xray Core to ${{ env.LATEST_TAG_NAME }}"
          tagging_message: ${{ env.LATEST_TAG_NAME }}

      - name: Trigger PRIME NET VPN build
        if: env.needs_update == 'true' && steps.auto-commit-action.outputs.changes_detected == 'true'
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/main.yml/dispatches \
            -d "{
              \"ref\": \"main\",
              \"inputs\": {
                \"release_tag\": \"${{ env.LATEST_TAG_NAME }}\"
              }
            }"
